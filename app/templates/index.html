<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏋️ Gym FAQ Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="chatbot-header">
            <div class="header-content">
                <h1>🏋️ Gym FAQ Assistant</h1>
                <p>Ask me anything about memberships, facilities, and services!</p>
            </div>
        </div>
        
        <!-- Chat Box -->
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                <div class="message-content">
                    👋 Welcome to Gym FAQ Chatbot! Ask me anything about our gym.
                </div>
                <div class="message-meta">Category: General</div>
            </div>
        </div>
        
        <!-- Input Area -->
        <div class="input-area">
            <input 
                type="text" 
                id="userInput" 
                class="user-input"
                placeholder="Ask me a question... e.g., 'What are your gym timings?'"
                autocomplete="off"
            >
            <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                <span>Send</span>
                <span class="send-icon">➤</span>
            </button>
        </div>
        
        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
